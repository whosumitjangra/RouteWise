name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build RouteWise Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Copy Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          ls -la android/app/src/main/assets/public/

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle.log 2>&1 || {
            echo "::error::Gradle build failed! Displaying output:"
            cat ../gradle.log | tail -n 80
            exit 1
          }

      - name: Upload Gradle Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log

      - name: Prepare APK Artifact
        run: |
          APK_FILE=$(find android -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK file found in android directory!"
            find android -type f
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" RouteWise.apk
          ls -lh RouteWise.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteWise-Android-APK
          path: RouteWise.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "RouteWise Android App v1.0.0"
          body: |
            ## 📱 RouteWise Android APK

            Download and install the official RouteWise Android APK for Pune Multimodal Transit.

            ### ⬇️ Direct Download
            - **[RouteWise.apk](https://github.com/whosumitjangra/RouteWise/releases/download/v1.0.0/RouteWise.apk)**

            ### 📋 Installation Guide:
            1. Download `RouteWise.apk` to your Android device.
            2. Tap the downloaded file in your browser notifications or file manager.
            3. Tap **Install** (if prompted, enable *Allow installation from this source*).
            4. Open RouteWise and explore Pune Metro, PMPML buses, RTO autos, and cabs!
          files: RouteWise.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
