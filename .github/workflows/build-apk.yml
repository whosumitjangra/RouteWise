name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build RouteWise Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RouteWise.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteWise-Android-APK
          path: RouteWise.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "RouteWise Android App v1.0.0"
          body: |
            ## 📱 RouteWise Android APK

            Download and install the official RouteWise Android APK for Pune Multimodal Transit.

            ### ⬇️ Download
            - **[RouteWise.apk](https://github.com/whosumitjangra/RouteWise/releases/download/v1.0.0/RouteWise.apk)**

            ### 📋 Installation Guide:
            1. Download `RouteWise.apk` to your Android device.
            2. Tap the downloaded file in your browser notifications or file manager.
            3. Tap **Install** (if prompted, enable *Allow installation from this source*).
            4. Open RouteWise and explore Pune Metro, PMPML buses, RTO autos, and cabs!
          files: RouteWise.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
